files:
  "..":
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), "..", ".."]
  ../..:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../..]
  .document_metadata.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [base_dir, .document_metadata.json]
  .ingested_docs.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [base_dir, .ingested_docs.json]
  doc_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  gcs_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  local_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.walk]
  local_path:
    type: variable
    actions: [read, write]
    params:
      caller: [os.path.basename, open]
  md_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, os.path.exists]
      alias: [f]
  pdf_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  pipeline.metadata_file:
    type: variable
    actions: [read, delete]
    params:
      caller: [os.path.exists, os.remove]
  pipeline.tracking_file:
    type: variable
    actions: [read, delete, write]
    params:
      caller: [os.path.exists, os.remove, open]
  rel_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [gcs_prefix, rel_path]
  REPORTS_DIR:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  temp_dir:
    type: variable
    actions: [delete]
    params:
      caller: [os.rmdir]
  temp_path:
    type: variable
    actions: [write, delete, read]
    params:
      caller: [open, os.remove, json.load]
      alias: [f]
  tracking_file:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  USAGE.md:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), USAGE.md]
  usage_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]

networks:
  server_url:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://{MCP_SERVER_CLIENT_HOST}:{MCP_SERVER_PORT}/mcp/
      caller: [connect]
      dynamic: "True"
      variable: server_url
  storage.cloud.google.com:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://storage.cloud.google.com/{bucket_name}/{object_path}
      caller: [format_context_preview, extract_source_citations]
